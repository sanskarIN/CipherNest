name: CipherNest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore non-MAUI test projects
        run: |
          dotnet restore tests/CipherNest.UnitTests/CipherNest.UnitTests.csproj
          dotnet restore tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj
          dotnet restore tests/CipherNest.UiTests/CipherNest.UiTests.csproj
      - name: Build tests with analyzers
        run: |
          dotnet build tests/CipherNest.UnitTests/CipherNest.UnitTests.csproj -c Release --no-restore
          dotnet build tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj -c Release --no-restore
          dotnet build tests/CipherNest.UiTests/CipherNest.UiTests.csproj -c Release --no-restore
      - name: Run tests
        run: |
          dotnet test tests/CipherNest.UnitTests/CipherNest.UnitTests.csproj -c Release --no-build
          dotnet test tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj -c Release --no-build
          dotnet test tests/CipherNest.UiTests/CipherNest.UiTests.csproj -c Release --no-build

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update
      - name: Restore Windows app
        run: dotnet restore src/CipherNest.App/CipherNest.App.csproj -p:TargetFramework=net10.0-windows10.0.19041.0
      - name: Build Windows app with analyzers
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore -p:WindowsPackageType=None

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Restore Android app
        run: dotnet restore src/CipherNest.App/CipherNest.App.csproj -p:TargetFramework=net10.0-android
      - name: Build Android app with analyzers
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -f net10.0-android --no-restore

  build-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install .NET MAUI Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst --skip-manifest-update
      - name: Restore iOS app
        run: dotnet restore src/CipherNest.App/CipherNest.App.csproj -p:TargetFramework=net10.0-ios
      - name: Build iOS app with analyzers
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -f net10.0-ios --no-restore
      - name: Restore Mac Catalyst app
        run: dotnet restore src/CipherNest.App/CipherNest.App.csproj -p:TargetFramework=net10.0-maccatalyst
      - name: Build Mac Catalyst app with analyzers
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -f net10.0-maccatalyst --no-restore
