name: CipherNest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ciphernest-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore non-MAUI test projects
        run: |
          dotnet restore tests/CipherNest.UnitTests/CipherNest.UnitTests.csproj
          dotnet restore tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj
          dotnet restore tests/CipherNest.UiTests/CipherNest.UiTests.csproj
      - name: Build tests with analyzers
        run: |
          dotnet build tests/CipherNest.UnitTests/CipherNest.UnitTests.csproj -c Release --no-restore
          dotnet build tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj -c Release --no-restore
          dotnet build tests/CipherNest.UiTests/CipherNest.UiTests.csproj -c Release --no-restore
      - name: Run tests
        run: |
          dotnet test tests/CipherNest.UnitTests/CipherNest.UnitTests.csproj -c Release --no-build
          dotnet test tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj -c Release --no-build
          dotnet test tests/CipherNest.UiTests/CipherNest.UiTests.csproj -c Release --no-build
      - name: Verify core formatting
        run: |
          dotnet format src/CipherNest.Domain/CipherNest.Domain.csproj --verify-no-changes --no-restore
          dotnet format src/CipherNest.Application/CipherNest.Application.csproj --verify-no-changes --no-restore
          dotnet format src/CipherNest.Infrastructure/CipherNest.Infrastructure.csproj --verify-no-changes --no-restore
          dotnet format src/CipherNest.Shared/CipherNest.Shared.csproj --verify-no-changes --no-restore
          dotnet format tests/CipherNest.UnitTests/CipherNest.UnitTests.csproj --verify-no-changes --no-restore
          dotnet format tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj --verify-no-changes --no-restore
          dotnet format tests/CipherNest.UiTests/CipherNest.UiTests.csproj --verify-no-changes --no-restore

  build-web-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build, format, and smoke-test local Web/Linux host
        run: bash scripts/verify-web.sh
      - name: Publish Linux x64 local host
        run: dotnet publish src/CipherNest.Web/CipherNest.Web.csproj -c Release -r linux-x64 --self-contained false --no-restore

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update
      - name: Build Windows app with analyzers
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -p:CipherNestTargetFrameworks=net10.0-windows10.0.19041.0 -f net10.0-windows10.0.19041.0 -r win-x64 -p:WindowsPackageType=None
      - name: Build Windows app with in-app funding disabled
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -p:CipherNestTargetFrameworks=net10.0-windows10.0.19041.0 -f net10.0-windows10.0.19041.0 -r win-x64 --no-restore -p:WindowsPackageType=None -p:CipherNestEnableFundingLink=false
      - name: Build local Web host on Windows
        run: dotnet build src/CipherNest.Web/CipherNest.Web.csproj -c Release

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Build Android app with analyzers
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -p:CipherNestTargetFrameworks=net10.0-android -f net10.0-android -r android-arm64

  build-apple:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.302'
      - name: Select compatible Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - name: Install .NET MAUI Apple workloads
        run: dotnet workload install maui-ios maui-maccatalyst --version 10.0.300.3
      - name: Build iOS simulator app with analyzers
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -p:CipherNestTargetFrameworks=net10.0-ios -f net10.0-ios -r iossimulator-arm64
      - name: Build Mac Catalyst app with analyzers
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -p:CipherNestTargetFrameworks=net10.0-maccatalyst -f net10.0-maccatalyst -r maccatalyst-arm64
      - name: Build local Web host on macOS
        run: dotnet build src/CipherNest.Web/CipherNest.Web.csproj -c Release
