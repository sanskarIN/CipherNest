name: Backup Header Schema Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply strict backup header schema
        run: python build/scripts/apply_backup_header_schema_20260815.py
      - name: Verify whitespace
        run: git diff --check
      - name: Commit source integration
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add -A
          git commit -m "security(backup): enforce strict header structure"
          git push origin main
