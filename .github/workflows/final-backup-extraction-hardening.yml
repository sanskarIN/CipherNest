name: Final backup extraction hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-backup-extraction-hardening
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Apply bounded extraction patch
        run: |
          python3 build/scripts/final-backup-extraction-hardening.py
          git diff --check
          git add src/CipherNest.Infrastructure/Services/EncryptedBackupService.cs
          git commit -m "fix(backup): bound actual archive extraction bytes"
      - name: Remove helper
        run: |
          rm build/scripts/final-backup-extraction-hardening.py
          rm .github/workflows/final-backup-extraction-hardening.yml
          git add -A
          git commit -m "build(final): remove backup extraction helper"
      - name: Push
        run: git push origin HEAD:main
