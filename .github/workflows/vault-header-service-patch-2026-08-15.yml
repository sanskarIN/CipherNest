name: Vault Header Service Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch VaultService
        run: python build/scripts/patch_vault_header_service_20260815.py
      - name: Verify whitespace
        run: git diff --check
      - name: Commit VaultService patch and cleanup helper
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add src/CipherNest.Infrastructure/Services/VaultService.cs
          git commit -m "security(vault): validate header schema before unwrap"
          git rm build/scripts/patch_vault_header_service_20260815.py .github/workflows/vault-header-service-patch-2026-08-15.yml
          git commit -m "chore(vault): remove strict header patch helper"
          git push origin main
