name: Consolidated Settings Documentation Sync

on:
  push:
    branches: [main]
    paths:
      - 'build/scripts/sync_complete_settings_20260815.py'
      - '.github/workflows/sync-complete-settings-2026-08-15.yml'

permissions:
  contents: write

concurrency:
  group: consolidated-settings-documentation-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Synchronize consolidated settings documentation
        run: python build/scripts/sync_complete_settings_20260815.py
      - name: Verify whitespace
        run: git diff --check
      - name: Commit and clean helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          if ! git diff --quiet -- docs/COMPLETE_PROJECT_DOCUMENTATION.md; then
            git add docs/COMPLETE_PROJECT_DOCUMENTATION.md
            git commit -m "docs(complete): synchronize settings JSON hardening"
          fi
          rm -f build/scripts/sync_complete_settings_20260815.py
          rm -f .github/workflows/sync-complete-settings-2026-08-15.yml
          git add -A build/scripts/sync_complete_settings_20260815.py .github/workflows/sync-complete-settings-2026-08-15.yml
          git commit -m "chore: remove consolidated settings sync helper"
          git push origin HEAD:main
