name: Append Roadmap Ledger

on:
  push:
    branches:
      - fix/roadmap-hardening-20260814

permissions:
  contents: write

jobs:
  append-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Append roadmap ledger
        shell: bash
        run: |
          if grep -Fq '## 2026-08-14 — Roadmap hardening continuation: lifecycle serialization, resource preflights, failure containment, and recovery-state accuracy' what_changed.md; then
            exit 0
          fi
          printf '%s' 'CiMjIDIwMjYtMDgtMTQg4oCUIFJvYWRtYXAg<a lot omitted intentionally for brevity in this rewrite>' | base64 -d >> what_changed.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add what_changed.md
          git commit -m 'docs: append August 14 roadmap hardening ledger'
          git push origin HEAD:fix/roadmap-hardening-20260814
