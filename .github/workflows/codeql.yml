name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 3 * * 1'

permissions:
  security-events: write
  packages: read
  contents: read

env:
  DOTNET_NOLOGO: true

concurrency:
  group: ciphernest-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build analyzable core
        run: dotnet build tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj -c Release
      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Build analyzable MAUI application
        run: dotnet build src/CipherNest.App/CipherNest.App.csproj -c Release -p:CipherNestTargetFrameworks=net10.0-android -f net10.0-android -r android-arm64
      - uses: github/codeql-action/analyze@v4
