name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '21 3 * * 1'

permissions:
  security-events: write
  packages: read
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build analyzable core
        run: dotnet build tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj -c Release
      - uses: github/codeql-action/analyze@v3
