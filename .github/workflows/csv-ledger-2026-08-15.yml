name: CSV Ledger Reconcile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile canonical records
        run: python3 build/scripts/reconcile_csv_ledger_20260815.py
      - name: Commit reconciled records
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile CSV hardening ledger and roadmap"
          git push origin HEAD:main
