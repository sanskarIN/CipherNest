name: Settings JSON Documentation Reconcile

on:
  push:
    branches: [main]
    paths:
      - 'build/scripts/reconcile_settings_json_20260815.py'
      - '.github/workflows/settings-json-reconcile-2026-08-15.yml'

permissions:
  contents: write

concurrency:
  group: settings-json-documentation-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconcile settings JSON documentation
        run: python build/scripts/reconcile_settings_json_20260815.py

      - name: Verify whitespace
        run: git diff --check

      - name: Commit focused documentation updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

          commit_file() {
            local path="$1"
            local message="$2"
            if ! git diff --quiet -- "$path"; then
              git add "$path"
              git commit -m "$message"
            fi
          }

          commit_file docs/TESTING_GUIDE.md "docs(testing): document bounded settings JSON coverage"
          commit_file docs/TEST_PLAN.md "docs(test-plan): require settings parser bounds"
          commit_file docs/NEXT_STEPS.md "docs(roadmap): reconcile settings adversarial work"
          commit_file PROJECT_STATUS.md "docs(status): record settings JSON hardening"
          commit_file CHANGELOG.md "docs(changelog): record settings JSON hardening"
          commit_file what_changed.md "docs(ledger): record settings JSON continuation"

          rm -f build/scripts/reconcile_settings_json_20260815.py
          rm -f .github/workflows/settings-json-reconcile-2026-08-15.yml
          git add -A build/scripts/reconcile_settings_json_20260815.py .github/workflows/settings-json-reconcile-2026-08-15.yml
          git commit -m "chore: remove settings reconciliation helper"
          git push origin HEAD:main
