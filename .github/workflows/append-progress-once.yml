name: Append CipherNest progress ledger once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  append-progress:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact main head
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append continuation and remove one-shot workflow
        shell: bash
        run: |
          cat >> what_changed.md <<'EOF'

