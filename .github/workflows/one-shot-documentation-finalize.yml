name: One-shot documentation finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-documentation-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Record changelog entry
        shell: python
        run: |
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          entry = "- Consolidated the complete project documentation into `docs/COMPLETE_PROJECT_DOCUMENTATION.md`, added `docs/FAQ.md`, linked both from the root/documentation hubs, and extended source tests so these documentation entry points remain required.\n"
          if entry not in text:
              marker = "### Added\n"
              if marker not in text:
                  raise SystemExit("CHANGELOG Added section not found")
              text = text.replace(marker, marker + entry, 1)
              p.write_text(text, encoding="utf-8")
      - run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then git commit -m "docs(changelog): record complete documentation consolidation"; fi

      - name: Record project status entry
        shell: python
        run: |
          from pathlib import Path
          p = Path("PROJECT_STATUS.md")
          text = p.read_text(encoding="utf-8")
          entry = "- A consolidated `docs/COMPLETE_PROJECT_DOCUMENTATION.md` reference and `docs/FAQ.md` now provide complete orientation/support entry points over the canonical specialist documentation; `DocumentationCoverageSourceTests` requires both files and their root/hub links.\n"
          if entry not in text:
              marker = "### Completed in source\n"
              if marker not in text:
                  raise SystemExit("PROJECT_STATUS completed section not found")
              text = text.replace(marker, marker + entry, 1)
              p.write_text(text, encoding="utf-8")
      - run: |
          git add PROJECT_STATUS.md
          if ! git diff --cached --quiet; then git commit -m "docs(status): record consolidated documentation completion"; fi

      - name: Append implementation ledger
        shell: python
        run: |
          from pathlib import Path
          p = Path("what_changed.md")
          text = p.read_text(encoding="utf-8")
          marker = "## 2026-08-14 — Complete documentation consolidation\n"
          if marker not in text:
              addition = """

## 2026-08-14 — Complete documentation consolidation

- Added `docs/COMPLETE_PROJECT_DOCUMENTATION.md` as a consolidated end-to-end reference for project identity, supported targets, repository architecture, security/key/session design, records, SQLite, resource limits, attachments, backup/restore, CSV, clipboard, secure notes, generators, deletion, settings/privacy, accessibility/localization, build, CI, release, support, and external validation gates.
- Added `docs/FAQ.md` covering common user, security, biometric, storage, backup, transfer, platform, build, CI, release, deletion, accessibility, and support questions without weakening the project's independent-audit or managed-memory limitations.
- Updated `docs/README.md` so the consolidated reference and FAQ are first-class canonical navigation entries.
- Updated root `README.md` so repository visitors can reach the complete documentation and FAQ directly.
- Extended `tests/CipherNest.UiTests/DocumentationCoverageSourceTests.cs` to require both new files, require root/hub links, and preserve consolidated security/release disclaimers.
- Updated `CHANGELOG.md` and `PROJECT_STATUS.md` to record the documentation consolidation.
- All repository mutations in this continuation were committed directly to `main`; Git commit identity uses `Sanskar <sanskarin@outlook.in>`.
"""
              p.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
      - run: |
          git add what_changed.md
          if ! git diff --cached --quiet; then git commit -m "docs(ledger): append complete documentation continuation"; fi

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-documentation-finalize.yml
          git commit -m "chore(docs): remove one-shot documentation finalizer"

      - name: Push finalization commits
        run: git push origin HEAD:main
