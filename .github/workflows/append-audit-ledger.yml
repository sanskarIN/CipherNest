name: Append Audit Ledger

on:
  push:
    branches:
      - fix/full-audit-20260814

permissions:
  contents: write

jobs:
  append-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Append audit ledger
        run: |
          if grep -Fq '## 2026-08-14 — Full error-fix audit continuation' what_changed.md; then
            exit 0
          fi
          printf '%s' '' | base64 --decode >> what_changed.md
          git diff --check
      - name: Commit ledger update
        run: |
          if git diff --quiet -- what_changed.md; then
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add what_changed.md
          git commit -m "docs(changelog): record full August 14 audit"
          git push origin HEAD:${GITHUB_REF_NAME}
