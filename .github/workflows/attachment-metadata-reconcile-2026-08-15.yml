name: Attachment metadata reconciliation 2026-08-15

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
      - name: Reconcile attachment hardening docs
        run: python3 build/scripts/reconcile_attachment_metadata_2026_08_15.py
      - name: Push reconciliation
        run: git push origin HEAD:main
