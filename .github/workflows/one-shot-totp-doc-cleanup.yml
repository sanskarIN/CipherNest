name: One-shot TOTP documentation consistency cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-totp-doc-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Remove stale TOTP and localization claims
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              changed = False
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
                      changed = True
              if changed:
                  p.write_text(text, encoding='utf-8')

          patch('PROJECT_STATUS.md', [
              ('- TOTP seed storage/generation.\n', '- TOTP QR scanning/rendering, bounded `otpauth://` import/export, and provider/autofill integration.\n'),
              ('- Additional translated resource catalogs such as Hindi; the preference/resource architecture exists, but the current release ships English content first.\n', '- Complete migration/review of the remaining UI literals into Hindi/additional catalogs; the reviewed Hindi resource-backed catalog is implemented, but complete UI translation is not claimed.\n'),
              ('- Settings for theme, language readiness, lock/privacy, reminder intervals, biometrics, generator defaults, storage/cache, backup/restore, import/export, security audit, privacy/threat information, About/legal/acknowledgements, master-passphrase change, and destructive deletion.\n', '- Settings for theme, System/English/Hindi language preference, lock/privacy, reminder intervals, biometrics, generator defaults, storage/cache, backup/restore, import/export, security audit, privacy/threat information, About/legal/acknowledgements, master-passphrase change, and destructive deletion.\n')
          ])

          patch('docs/MAINTAINER_GUIDE.md', [
              ('Current release is English-first.\n', 'Neutral English remains the fallback and a reviewed Hindi resource-backed catalog is implemented; remaining literal UI text can still appear in English.\n'),
              ('- TOTP;\n', '- TOTP QR scanning/rendering, `otpauth://` enrollment interoperability, and provider/autofill integration;\n'),
              ('- complete additional-language catalogs.\n', '- complete migration/review of remaining UI literals into additional-language catalogs.\n'),
              ('- store/API tokens.\n', '- store/API tokens;\n- real TOTP seeds or generated one-time codes.\n')
          ])

          patch('docs/releases/STORE_LISTING_GUIDE.md', [
              ('- verify no deferred feature (cloud sync, autofill, TOTP, Windows Hello, rich PDF scanning, complete additional-language catalog, etc.) is implied to be complete;\n', '- verify no deferred feature (cloud sync, autofill/provider integration, TOTP QR/`otpauth://` enrollment interoperability, Windows Hello, rich PDF scanning, complete migration of all UI literals into additional-language catalogs, etc.) is implied to be complete;\n'),
              ('recovery keys, imported documents, private attachments, or diagnostic paths.', 'recovery keys, TOTP seeds/codes, imported documents, private attachments, or diagnostic paths.')
          ])

          patch('docs/NEXT_STEPS.md', [
              ('- Continue migrating remaining user-facing literal strings into resource catalogs.\n- Continue migrating remaining user-facing literal strings into the neutral/Hindi resource catalogs;', '- Continue migrating remaining user-facing literal strings into the neutral/Hindi resource catalogs;')
          ])

          patch('docs/USER_GUIDE.md', [
              ('responsive layouts, minimum touch-target guidance, and English-first resource-backed localization architecture.', 'responsive layouts, minimum touch-target guidance, and neutral-English-fallback/reviewed-Hindi resource-backed localization architecture.')
          ])

          patch('docs/README.md', [
              ('- [`verification/DOCUMENTATION_CONSOLIDATION_2026_08_14.md`](verification/DOCUMENTATION_CONSOLIDATION_2026_08_14.md) — repository-side scope and gate for the complete-documentation consolidation, including the required current-head rerun and external validation limits.\n', '- [`verification/DOCUMENTATION_CONSOLIDATION_2026_08_14.md`](verification/DOCUMENTATION_CONSOLIDATION_2026_08_14.md) — repository-side scope and gate for the complete-documentation consolidation, including the required current-head rerun and external validation limits.\n- [`verification/TOTP_AND_HINDI_LOCALIZATION_2026_08_14.md`](verification/TOTP_AND_HINDI_LOCALIZATION_2026_08_14.md) — exact current-head source/test/platform/CodeQL contract for local TOTP plus the reviewed Hindi resource-backed catalog.\n')
          ])

          p = Path('what_changed.md')
          text = p.read_text(encoding='utf-8')
          marker = '### TOTP/Hindi follow-up consistency fixes\n'
          if marker not in text:
              text = text.rstrip() + '\n\n' + dedent('''
              ### TOTP/Hindi follow-up consistency fixes

              - Fixed the bounded TOTP normalization buffer so the complete 4,096-character formatted-input budget can be processed before the 1,024-character normalized-secret ceiling/padding rules are applied, and added a maximum normalized-seed regression test.
              - Changed the integration test's temporary synthetic seed byte cleanup to `CryptographicOperations.ZeroMemory` after encrypted-envelope inspection.
              - Added `docs/verification/TOTP_AND_HINDI_LOCALIZATION_2026_08_14.md` and made documentation coverage require the TOTP security document, the new verification contract, root TOTP link, audit disclaimer, factor-separation limitation, and partial-translation honesty.
              - Removed remaining stale statements that still described core TOTP generation or the reviewed Hindi catalog as wholly deferred; future wording now distinguishes QR/`otpauth://`/autofill/provider integration and complete remaining-UI translation from the implemented core.
              ''').strip() + '\n'
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup files separately
        run: |
          commit_one () {
            git add "$1"
            if ! git diff --cached --quiet; then git commit -m "$2"; fi
          }
          commit_one PROJECT_STATUS.md "docs(status): remove stale deferred TOTP and Hindi claims"
          commit_one docs/MAINTAINER_GUIDE.md "docs(maintainer): align deferred feature boundaries"
          commit_one docs/releases/STORE_LISTING_GUIDE.md "docs(store): remove stale TOTP deferred claim"
          commit_one docs/NEXT_STEPS.md "docs(roadmap): remove duplicate localization action"
          commit_one docs/USER_GUIDE.md "docs(user): align localization overview wording"
          commit_one docs/README.md "docs: link TOTP and Hindi verification contract"
          commit_one what_changed.md "docs(ledger): append TOTP consistency follow-up"

      - name: Remove cleanup workflow
        run: |
          git rm .github/workflows/one-shot-totp-doc-cleanup.yml
          git commit -m "chore(docs): remove one-shot TOTP consistency cleanup"

      - name: Push cleanup commits
        run: git push origin HEAD:main
