name: One-shot documentation verification ledger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-documentation-verification-ledger.yml

permissions:
  contents: write

jobs:
  finalize-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"

      - name: Append verification-layer ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path("what_changed.md")
          text = p.read_text(encoding="utf-8")
          marker = "## 2026-08-14 — Documentation current-head verification layer\n"
          if marker not in text:
              addition = """

              ## 2026-08-14 — Documentation current-head verification layer

              - Added `docs/verification/DOCUMENTATION_CONSOLIDATION_2026_08_14.md` to define the repository-side gate for the complete-documentation continuation and to distinguish current-head verification from historical CI evidence.
              - Linked the August 14 verification record from `docs/README.md`.
              - Extended `DocumentationCoverageSourceTests` so the August 14 verification record is required, linked from the documentation hub, and retains its current-head and independent-audit limitations.
              - Prepared the repository for a final direct `main` commit so the full configured CI and CodeQL workflows execute on the complete post-ledger tree rather than relying on superseded historical runs.
              """
              p.write_text(text.rstrip() + textwrap.dedent(addition) + "\n", encoding="utf-8")
          PY

      - name: Commit ledger
        run: |
          git add what_changed.md
          if ! git diff --cached --quiet; then git commit -m "docs(ledger): append documentation verification layer"; fi

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-documentation-verification-ledger.yml
          git commit -m "chore(docs): remove one-shot verification ledger writer"

      - name: Push ledger commits
        run: git push origin HEAD:main
