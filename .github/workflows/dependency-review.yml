name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ciphernest-dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Audit direct and transitive NuGet dependencies
        run: |
          dotnet restore tests/CipherNest.UnitTests/CipherNest.UnitTests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore tests/CipherNest.IntegrationTests/CipherNest.IntegrationTests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet restore tests/CipherNest.UiTests/CipherNest.UiTests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all
